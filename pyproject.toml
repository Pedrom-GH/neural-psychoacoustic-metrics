[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psychonet"
version = "0.1.0"
description = "Neural estimation of ISO 532-1 loudness and DIN 45692 sharpness from calibrated audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Muñoz Álvarez" }]
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    "torch>=2.2",
    "mosqito>=1.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
